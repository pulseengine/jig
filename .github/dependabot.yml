version: 2
# Grouped monthly updates (fleet template from pulseengine/rivet, owner
# decision 2026-11-21). One entry per ecosystem, its directories in one
# `directories:` list. Every entry runs monthly (the 1st, 02:00 UTC), keeps at
# most 2 PRs open, and waits 7 days after a release (cooldown). Lockstep
# groups come first because Dependabot puts a dependency in the FIRST group it
# matches; then one minor-patch group. Majors stay ungrouped, one PR each, so a
# breaking change is read on its own. Security updates ignore the schedule and
# the limit.
#
# Not listed on purpose: ci-controls/fixtures/cargo and ci-controls/fixtures/npm
# are plant fixtures; their locks are inputs the controls depend on, so a
# version bump there would change what the controls test.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
