# jig's own CI: rivet validate, actionlint, and the Rust gates with jig's
# planted controls and stand-ins, on light runners behind the fork guard.
# Phase 0: the baseline and required jobs call jig's own reusable workflows
# (baseline.yml's guard uses plant v0.5.0, which carries plant#34 and #38).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `shell: bash` runs with -eo pipefail, so a piped step reports its own exit.
defaults:
  run:
    shell: bash

env:
  # The rivet that pulseengine layer 2026.11.32 carried (0.43.0); varve.toml
  # now pins covalent 2026.11.28, which carries rivet 0.43.3 (validates jig the
  # same, 2026-11-27). sha256 of rivet-v0.43.0-x86_64-unknown-linux-gnu.tar.gz from the
  # release's SHA256SUMS.txt, recorded 2026-11-21; the extracted binary
  # (a8c3dec7…f770) matches the digest in the signed layer.
  RIVET_VERSION: v0.43.0
  RIVET_SHA256: b3681544f1a49d9ec71ba271daa8de1f45e50a8a1362370ca068603b8a94f22c
  # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release's
  # checksums.txt, recorded 2026-11-21.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # plant v0.5.0, x86_64-unknown-linux-musl, from SHA256SUMS.txt verified
  # with cosign against release.yml@refs/tags/v0.5.0 on 2026-11-25.
  PLANT_VERSION: v0.5.0
  PLANT_SHA256: 8998648bbea539d57e048ad8782aad7743f4b15f3b2b2e7b9e9e40d178a0a09c
  # wasmtime v51.0.0, x86_64-linux: sha256 from the release asset digest,
  # matched by download and gh attestation verify (exit 0) on 2026-11-27.
  WASMTIME_VERSION: v51.0.0
  WASMTIME_SHA256: a18020674fac4107f329bc9ed720ea9c88e4b30a61e8a527787bcce051123d32
  # meld v0.70.0 and kiln v0.9.0, x86_64-unknown-linux-musl: from each
  # SHA256SUMS.txt, verified with cosign against release.yml@refs/tags/<tag>
  # and gh attestation verify (exit 0) on 2026-11-27. The same versions as
  # covalent 2026.11.28 (varve.toml).
  MELD_VERSION: v0.70.0
  MELD_SHA256: 9ff3e50d538a54fd129a8962733b766569218eb9dbb8b9be642b389b6063895c
  KILN_VERSION: v0.9.0
  KILN_SHA256: 768a1f5971656635d24b614d48fb50337e810da0e8c8006f8e863d40bc550ec2

jobs:
  rivet:
    name: rivet validate
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch pinned rivet release
        run: |
          d="$RUNNER_TEMP/rivet"; mkdir -p "$d"; cd "$d"
          asset="rivet-$RIVET_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$asset" "https://github.com/pulseengine/rivet/releases/download/$RIVET_VERSION/$asset"
          echo "$RIVET_SHA256  $asset" | sha256sum -c -
          tar xzf "$asset"
          echo "$d/$(dirname "$(find . -name rivet -type f | head -1)")" >> "$GITHUB_PATH"
      - name: rivet validate
        run: |
          rivet --version
          rivet validate

  lint:
    name: actionlint
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch pinned actionlint release
        run: |
          d="$RUNNER_TEMP/actionlint"; mkdir -p "$d"; cd "$d"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$asset"
          echo "$ACTIONLINT_SHA256  $asset" | sha256sum -c -
          tar xzf "$asset" actionlint
          echo "$d" >> "$GITHUB_PATH"
      - name: actionlint
        run: |
          actionlint -version
          actionlint -no-color .github/workflows/*.yml

  test:
    name: test
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --no-fail-fast
      - name: build jig
        run: |
          cargo build --locked --release
          echo "JIG=$PWD/target/release/jig" >> "$GITHUB_ENV"
          # the supply controls run the workflow step, which calls jig by name
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: jig on jig
        run: |
          "$JIG" verdict --self-test
          "$JIG" pins .
      # Run what we build (REQ-028): the wasm32-wasip2 jig under the pinned
      # wasmtime must give native jig's output and exit code for pins, the verdict
      # self-test and a could-not-run verdict (exit 2), and turn red on a
      # planted tag ref like native.
      - name: jig as wasm32-wasip2 under wasmtime matches native
        run: |
          d="$RUNNER_TEMP/wasmtime"; mkdir -p "$d"
          a="wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz"
          (cd "$d" && curl -fsSL -o "$a" "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/$a" \
            && echo "$WASMTIME_SHA256  $a" | sha256sum -c - && tar -xJf "$a")
          cargo build --locked --release --target wasm32-wasip2
          WASMTIME="$d/wasmtime-$WASMTIME_VERSION-x86_64-linux/wasmtime" JIG_WASM=target/wasm32-wasip2/release/jig.wasm \
            bash ci-controls/wasm-native.sh
      - name: fetch pinned rivet, actionlint and plant
        run: |
          d="$RUNNER_TEMP/tools"; mkdir -p "$d"; cd "$d"
          r="rivet-$RIVET_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$r" "https://github.com/pulseengine/rivet/releases/download/$RIVET_VERSION/$r"
          echo "$RIVET_SHA256  $r" | sha256sum -c -
          mkdir rivet-x && tar -xzf "$r" -C rivet-x
          cp "$(find rivet-x -name rivet -type f | head -1)" .
          a="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$a" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$a"
          echo "$ACTIONLINT_SHA256  $a" | sha256sum -c -
          tar -xzf "$a" actionlint
          p="plant-$PLANT_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$p" "https://github.com/pulseengine/plant/releases/download/$PLANT_VERSION/$p"
          echo "$PLANT_SHA256  $p" | sha256sum -c -
          tar -xzf "$p" ./plant
          echo "$d" >> "$GITHUB_PATH"
      # supply-npm-advisory needs npm; the same pin and version as baseline.yml's
      # supply, so a light pool without node turns the control red.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      # supply-cargo-nested-vulnerable runs the audit step's text: the same
      # cargo-audit version baseline.yml installs.
      - name: cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.1
      # Each control plants one bad input; only exit 0 (every control PASS)
      # is green. A dedicated target dir, never this repo's target/.
      - name: plant controls
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/plant-controls-target
        run: plant ci-controls.toml
      # The stand-ins cannot fail, so every control must come back FAIL-OPEN:
      # plant exits 1, and the FAIL-OPEN count equals the manifest's count.
      - name: stand-ins report FAIL-OPEN
        run: |
          set +e
          plant ci-controls.stand-in.toml --format json > "$RUNNER_TEMP/stand-in.json"
          rc=$?
          set -e
          want=$(grep -c '^\[\[control\]\]' ci-controls.stand-in.toml)
          open=$(grep -c '"reason": "FAIL-OPEN' "$RUNNER_TEMP/stand-in.json" || true)
          echo "plant exit $rc; $open of $want stand-in controls FAIL-OPEN"
          [ "$rc" -eq 1 ] && [ "$want" -gt 0 ] && [ "$open" -eq "$want" ]

  # Phase 0: jig calls its own baseline and required workflows, from this
  # commit, building jig from source. "required / verdict" becomes the one
  # required context once this has run green on main.
  baseline:
    uses: ./.github/workflows/baseline.yml
    with:
      audit: cargo-audit
      jig-from-source: true
      # jig names nothing private; the synthetic shape keeps the step live.
      names-patterns: ci-controls/fixtures/names-patterns.txt
      names-allow: ci-controls/fixtures/names-allow.txt

  # Advisory canary (owner rule, 2026-11-21: every workflow pins 1.100.0 plus
  # one canary on stable per repo). It warns early about the next Rust release
  # and can never gate: continue-on-error, needed only by required, listed in
  # advisory (REQ-021).
  canary:
    name: canary (stable)
    continue-on-error: true
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
          components: clippy
      - name: clippy and test on stable
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/canary-target
        run: |
          rustc --version
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-fail-fast

  # Advisory kiln runner (REQ-029): jig's wasm32-wasip2 build, fused by meld
  # with --reproducible and an explicit --memory multi (meld ADR-4), must give
  # native jig's output and exit codes under kiln. Advisory like the canary:
  # it warns about our own chain and can never gate.
  kiln:
    name: jig fused by meld under kiln
    continue-on-error: true
    # Fork PRs never reach self-hosted runners (fail-closed same-repo guard).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    # Each kiln call is capped at 120 s by ci-controls/kiln-run (kiln#748).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip2
      - name: fetch pinned meld and kiln
        run: |
          d="$RUNNER_TEMP/chain"; mkdir -p "$d"; cd "$d"
          m="meld-$MELD_VERSION-x86_64-unknown-linux-musl.tar.gz"
          k="kiln-$KILN_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$m" "https://github.com/pulseengine/meld/releases/download/$MELD_VERSION/$m"
          curl -fsSL -o "$k" "https://github.com/pulseengine/kiln/releases/download/$KILN_VERSION/$k"
          printf '%s  %s\n%s  %s\n' "$MELD_SHA256" "$m" "$KILN_SHA256" "$k" | sha256sum -c -
          tar -xzf "$m" --strip-components=1 "meld-$MELD_VERSION-x86_64-unknown-linux-musl/meld"
          tar -xzf "$k" ./kiln
          ./meld --version
          ./kiln --version
      - name: jig fused by meld under kiln matches native
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/kiln-target
        run: |
          c="$RUNNER_TEMP/chain"
          cargo build --locked --release
          cargo build --locked --release --target wasm32-wasip2
          t="$CARGO_TARGET_DIR"
          "$c/meld" fuse --reproducible --memory multi --emit-import-map "$c/jig.map.json" -o "$c/jig.fused.wasm" "$t/wasm32-wasip2/release/jig.wasm"
          "$c/meld" fuse --reproducible --memory multi --emit-import-map "$c/again.map.json" -o "$c/again.fused.wasm" "$t/wasm32-wasip2/release/jig.wasm"
          cmp "$c/jig.fused.wasm" "$c/again.fused.wasm"
          cmp "$c/jig.map.json" "$c/again.map.json"
          sha256sum "$c/jig.fused.wasm"
          JIG="$t/release/jig" JIG_WASM="$c/jig.fused.wasm" WASMTIME="$PWD/ci-controls/kiln-run" \
            KILN="$c/kiln" KILN_IMPORT_MAP="$c/jig.map.json" WASM_RUNNER=kiln \
            bash ci-controls/wasm-native.sh

  required:
    needs: [baseline, rivet, lint, test, canary, kiln]
    if: always()
    uses: ./.github/workflows/required.yml
    with:
      needs-json: ${{ toJSON(needs) }}
      never-skip: "rivet lint test"
      advisory: "canary kiln"
      jig-from-source: true
