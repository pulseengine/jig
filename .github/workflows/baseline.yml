# jig baseline: the checks every pulseengine repository needs and no
# repository should own alone: guard, pins, supply and plant controls.
# Classification is not here: each caller keeps sieve's classify step as its
# own job, in the form sieve check-workflows verifies, with its own class
# names (owner decision 2026-11-21). Called, never triggered directly:
#
#   baseline:
#     uses: pulseengine/jig/.github/workflows/baseline.yml@<40-hex-sha>
#
# Pin by full SHA. A jig change reaches a caller only through that caller's
# own bump PR (REQ-012). Design: docs/design.md. Every job here is light
# work, so the pool is fixed (plant guard refuses a runner taken from an
# input); the github context is the caller's, so the fail-closed fork guard
# sees the caller's event and sends a fork PR to the hosted runner.
#
# No secrets are declared or used (REQ-011). Tools are fetched by exact
# version and checked against a sha256 recorded from the release's
# cosign-verified SHA256SUMS.txt; sums are never fetched at run time
# (REQ-010, DD-013).
name: baseline

on:
  workflow_call:
    inputs:
      audit:
        description: "Cargo auditor: cargo-audit, cargo-deny or none (none needs no Cargo.lock in the tree)"
        type: string
        default: cargo-audit
      bazel:
        description: "Require --lockfile_mode=error in .bazelrc"
        type: boolean
        default: false
      controls:
        description: "plant manifest"
        type: string
        default: ci-controls.toml
      controls-only:
        description: "Space-separated plant control ids to run per PR (empty: skip the controls job)"
        type: string
        default: ""
      guard-config:
        description: "plant guard config; empty means plant's default lookup"
        type: string
        default: ""
      lockfile-census:
        description: "Lockfile census (gale format): Cargo workspaces that ship without a lock, each with an issue and a reason; empty means none may"
        type: string
        default: ""
      names-patterns:
        description: "Tracked file of private-name shape patterns (regexes that name no real host) for jig names, or none; empty is red"
        type: string
        default: ""
      names-allow:
        description: "Tracked allow file for jig names: paths it skips; empty means none"
        type: string
        default: ""
      jig-from-source:
        description: "Build jig from the caller's checkout. Only pulseengine/jig itself may set this (phase 0)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # jig itself: set by the commit that follows each signed jig release
  # (docs/releasing.md). v0.1.6: sha256 of the x86_64 musl archive from
  # SHA256SUMS.txt, verified with cosign against release.yml@refs/tags/v0.1.6
  # on 2026-11-25.
  JIG_VERSION: v0.1.6
  JIG_SHA256: 73eab8344fc731803e67b6cc284a87bacc5c3c8b8d471e8bf3bd793a549be069
  # plant v0.5.0 (carries plant#34 trusted_workflows, plant#38 .planted names),
  # x86_64-unknown-linux-musl, from SHA256SUMS.txt verified with cosign against
  # release.yml@refs/tags/v0.5.0 on 2026-11-25.
  PLANT_VERSION: v0.5.0
  PLANT_SHA256: 8998648bbea539d57e048ad8782aad7743f4b15f3b2b2e7b9e9e40d178a0a09c

jobs:
  guard:
    name: guard
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch pinned plant
        run: |
          d="$RUNNER_TEMP/plant"; mkdir -p "$d"; cd "$d"
          a="plant-$PLANT_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$a" "https://github.com/pulseengine/plant/releases/download/$PLANT_VERSION/$a"
          echo "$PLANT_SHA256  $a" | sha256sum -c -
          tar -xzf "$a" ./plant
          echo "$d" >> "$GITHUB_PATH"
      - name: plant guard
        env:
          GUARD_CONFIG: ${{ inputs.guard-config }}
        run: |
          plant --version
          if [ -n "$GUARD_CONFIG" ]; then plant guard . --config "$GUARD_CONFIG"; else plant guard .; fi

  pins:
    name: pins
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        if: inputs.jig-from-source
        with:
          toolchain: 1.100.0
      - name: install jig
        env:
          FROM_SOURCE: ${{ inputs.jig-from-source }}
          REPO: ${{ github.repository }}
        run: |
          d="$RUNNER_TEMP/jig"; mkdir -p "$d"
          if [ "$FROM_SOURCE" = true ]; then
            [ "$REPO" = pulseengine/jig ] || { echo "jig-from-source is only for pulseengine/jig"; exit 1; }
            cargo build --locked --release --target-dir "$RUNNER_TEMP/jig-target"
            cp "$RUNNER_TEMP/jig-target/release/jig" "$d/"
          else
            [ -n "$JIG_SHA256" ] || { echo "no jig release is pinned in this baseline.yml"; exit 1; }
            a="jig-$JIG_VERSION-x86_64-unknown-linux-musl.tar.gz"
            (cd "$d" && curl -fsSL -o "$a" "https://github.com/pulseengine/jig/releases/download/$JIG_VERSION/$a" \
              && echo "$JIG_SHA256  $a" | sha256sum -c - && tar -xzf "$a" ./jig)
          fi
          echo "$d" >> "$GITHUB_PATH"
      - name: jig pins
        run: |
          jig --version
          jig pins .
      # Shape patterns only, from a tracked file: exact names passed as an
      # input would be printed in this step's env header (REQ-026, DD-019).
      # Same text as ci-controls/names.sh (tests/supply.rs keeps them equal).
      - name: private names
        env:
          NAMES_PATTERNS: ${{ inputs.names-patterns }}
          NAMES_ALLOW: ${{ inputs.names-allow }}
        run: |
          case "$NAMES_PATTERNS" in
            "")
              echo "private-name guard has no patterns: pass names-patterns: <tracked shapes file>, or names-patterns: none"
              exit 1 ;;
            none)
              echo "::warning title=names: off::names-patterns: none; the private-name guard is off for this repository"
              if [ -n "$GITHUB_STEP_SUMMARY" ]; then echo "names: off (names-patterns: none)" >> "$GITHUB_STEP_SUMMARY"; fi
              exit 0 ;;
          esac
          git ls-files --error-unmatch -- "$NAMES_PATTERNS" > /dev/null 2>&1 \
            || { echo "names-patterns: $NAMES_PATTERNS is not a tracked file"; exit 1; }
          if [ -n "$NAMES_ALLOW" ]; then
            jig names . --patterns "$NAMES_PATTERNS" --allow "$NAMES_ALLOW"
          else
            jig names . --patterns "$NAMES_PATTERNS"
          fi

  supply:
    name: supply
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: 1.100.0
      - name: install jig
        env:
          FROM_SOURCE: ${{ inputs.jig-from-source }}
          REPO: ${{ github.repository }}
        run: |
          d="$RUNNER_TEMP/jig"; mkdir -p "$d"
          if [ "$FROM_SOURCE" = true ]; then
            [ "$REPO" = pulseengine/jig ] || { echo "jig-from-source is only for pulseengine/jig"; exit 1; }
            cargo build --locked --release --target-dir "$RUNNER_TEMP/jig-target"
            cp "$RUNNER_TEMP/jig-target/release/jig" "$d/"
          else
            [ -n "$JIG_SHA256" ] || { echo "no jig release is pinned in this baseline.yml"; exit 1; }
            a="jig-$JIG_VERSION-x86_64-unknown-linux-musl.tar.gz"
            (cd "$d" && curl -fsSL -o "$a" "https://github.com/pulseengine/jig/releases/download/$JIG_VERSION/$a" \
              && echo "$JIG_SHA256  $a" | sha256sum -c - && tar -xzf "$a" ./jig)
          fi
          echo "$d" >> "$GITHUB_PATH"
      # Every tracked file named exactly Cargo.lock binds under --locked, and
      # every Cargo workspace has one or is listed in the census (REQ-006,
      # REQ-025).
      - name: cargo lockfiles are fresh
        env:
          CENSUS: ${{ inputs.lockfile-census }}
        run: |
          # Workspaces are found from the tracked Cargo.toml files (outside
          # target/), so a nested workspace whose lock was never committed is
          # red unless the census lists it with an issue and a reason.
          git rev-parse --show-toplevel > /dev/null
          # Capture, then test: grep -q exits at the first match, and under
          # pipefail the writer's SIGPIPE would make the test false and skip
          # the check.
          manifests=$(git ls-files -- '*Cargo.toml' | awk -F/ '$NF == "Cargo.toml"')
          if [ -n "$manifests" ]; then
            if [ -n "$CENSUS" ]; then jig lockfiles . --census "$CENSUS"; else jig lockfiles .; fi
          fi
          n=0
          while IFS= read -r lock; do
            n=$((n+1)); dir=$(dirname "$lock")
            echo "::group::cargo metadata --locked in $dir"
            cargo metadata --locked --format-version 1 --manifest-path "$dir/Cargo.toml" > /dev/null
            echo "::endgroup::"
          done < <(git ls-files -- '*Cargo.lock' | awk -F/ '$NF == "Cargo.lock"')
          echo "$n Cargo.lock file(s) checked"
          if [ "$n" -eq 0 ] && [ -n "$manifests" ]; then
            echo "Cargo.toml is tracked but no Cargo.lock is: commit the lockfile"; exit 1
          fi
      - name: cargo audit
        if: inputs.audit != 'none'
        env:
          AUDIT: ${{ inputs.audit }}
        run: |
          case "$AUDIT" in
            cargo-audit) cargo install --locked cargo-audit --version 0.22.1 ;;
            cargo-deny) cargo install --locked cargo-deny --version 0.22.0 ;;
            *) echo "unknown audit input '$AUDIT'"; exit 1 ;;
          esac
          n=0
          while IFS= read -r lock; do
            n=$((n+1))
            echo "::group::$AUDIT $lock"
            if [ "$AUDIT" = cargo-audit ]; then
              cargo audit --file "$lock"
            else
              cargo deny --manifest-path "$(dirname "$lock")/Cargo.toml" check advisories
            fi
            echo "::endgroup::"
          done < <(git ls-files -- '*Cargo.lock' | awk -F/ '$NF == "Cargo.lock"')
          echo "$n Cargo.lock file(s) audited, no waivers"
      - name: audit none means no Cargo.lock
        if: inputs.audit == 'none'
        run: |
          locks=$(git ls-files -- '*Cargo.lock' | awk -F/ '$NF == "Cargo.lock"')
          if [ -n "$locks" ]; then
            echo "audit: none, but the tree has a Cargo.lock; pick cargo-audit or cargo-deny"; exit 1
          fi
      # npm: the lock must match package.json, and npm audit runs on it. The
      # light pool has no node, so install it when the tree has a lockfile
      # (warte#194: "npm: command not found", exit 127).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('**/package-lock.json') != ''
        with:
          node-version: 26.13.1
      # Same text as ci-controls/npm-lockfiles.sh, which the supply-npm-advisory
      # control runs (tests/supply.rs keeps the two equal).
      - name: npm lockfiles
        run: |
          n=0
          while IFS= read -r lock; do
            n=$((n+1)); dir=$(dirname "$lock")
            command -v npm > /dev/null || { echo "npm unavailable on this runner; $lock cannot be checked"; exit 1; }
            echo "::group::npm $lock"
            before=$(mktemp)
            cp "$lock" "$before"
            (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund > /dev/null)
            cmp -s "$before" "$lock" || { diff -u "$before" "$lock" || true; echo "$lock is out of sync with package.json"; exit 1; }
            (cd "$dir" && npm audit --package-lock-only --audit-level=low)
            echo "::endgroup::"
          done < <(git ls-files -- '*package-lock.json' | awk -F/ '$NF == "package-lock.json"')
          echo "$n package-lock.json file(s) checked"
      - name: bazel lockfile mode
        if: inputs.bazel
        run: |
          grep -Eq '^(common|build)[[:space:]]+--lockfile_mode=error([[:space:]]|$)' .bazelrc \
            || { echo ".bazelrc must carry 'common --lockfile_mode=error'"; exit 1; }
          git ls-files --error-unmatch MODULE.bazel.lock > /dev/null

  controls:
    name: controls
    if: inputs.controls-only != ''
    # Same-repo runs only: plant executes the manifest's commands.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: 1.100.0
      - name: fetch pinned plant
        run: |
          d="$RUNNER_TEMP/plant"; mkdir -p "$d"; cd "$d"
          a="plant-$PLANT_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$a" "https://github.com/pulseengine/plant/releases/download/$PLANT_VERSION/$a"
          echo "$PLANT_SHA256  $a" | sha256sum -c -
          tar -xzf "$a" ./plant
          echo "$d" >> "$GITHUB_PATH"
      # The ids come from the caller's reviewed workflow file, never from PR
      # text. Only exit 0 is green; 2 (could not run) is not a pass.
      - name: plant controls
        env:
          MANIFEST: ${{ inputs.controls }}
          ONLY: ${{ inputs.controls-only }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/plant-controls-target
        run: |
          args=()
          for id in $ONLY; do args+=(--only "$id"); done
          plant --version
          plant "$MANIFEST" "${args[@]}"

