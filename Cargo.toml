[package]
name = "jig"
version = "0.1.9"
edition = "2024"
description = "pulseengine shared CI baseline: verdict aggregator checks and action-pin check"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "std", "serde"] }
yaml-rust2 = "0.13"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "pty", "termios"] }
