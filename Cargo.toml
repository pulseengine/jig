[package]
name = "jig"
version = "0.1.5"
edition = "2024"
description = "pulseengine shared CI baseline: verdict aggregator checks and action-pin check"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "std", "serde"] }
yaml-rust2 = "0.13"
