# rivet: verifies REQ-004
# jig's own planted controls (REQ-004). Each plants one bad input and needs
# the named check to go red; the unplanted baseline must stay green. `check`
# carries the class as "<class>: <job name>" (plant treats it as opaque).
#
# Run from the repository root with JIG set to a built jig binary, and
# rivet and actionlint on PATH:
#   JIG=$PWD/target/release/jig plant ci-controls.toml
# The stand-ins in ci-controls.stand-in.toml must all report FAIL-OPEN.

[[control]]
id = "pins-tag-ref"
check = "pins: baseline / pins"
run = '"$JIG" pins .'
plant = "ci-controls/pins-tag-ref"
stderr_or_stdout_matches = 'actions/checkout@v4. is not pinned'

[[control]]
id = "pins-floating-toolchain"
check = "pins: baseline / pins"
run = '"$JIG" pins .'
plant = "ci-controls/pins-floating-toolchain"
stderr_or_stdout_matches = 'toolchain .stable. is not a version'

[[control]]
id = "pins-canary-needed"
check = "pins: baseline / pins"
run = '"$JIG" pins .'
plant = "ci-controls/pins-canary-needed"
stderr_or_stdout_matches = 'toolchain .stable. is not a version'

[[control]]
id = "required-sees-failure"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-sees-failure"
stderr_or_stdout_matches = 'job .clippy. result is failure'

[[control]]
id = "required-sees-cancelled"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-sees-cancelled"
stderr_or_stdout_matches = 'job .clippy. result is cancelled'

[[control]]
id = "required-sees-empty"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-sees-empty"
stderr_or_stdout_matches = 'needs is empty'

[[control]]
id = "required-sees-selected-skip"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-sees-selected-skip"
stderr_or_stdout_matches = 'class .build. was selected'

[[control]]
id = "required-sees-never-skip-skip"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-sees-never-skip-skip"
stderr_or_stdout_matches = 'clippy. was skipped but is never-skip'

[[control]]
id = "required-sees-missing-job"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-sees-missing-job"
stderr_or_stdout_matches = 'job .test. is in the workflow but missing from needs'

[[control]]
id = "caller-paths-filter"
check = "aggregator: required / verdict"
run = '"$JIG" caller --workflow ci-controls/fixtures/caller.yml'
plant = "ci-controls/caller-paths-filter"
stderr_or_stdout_matches = 'paths'

[[control]]
id = "caller-no-permissions"
check = "aggregator: required / verdict"
run = '"$JIG" caller --workflow ci-controls/fixtures/caller.yml'
plant = "ci-controls/caller-no-permissions"
stderr_or_stdout_matches = 'no top-level permissions:'

[[control]]
id = "caller-write-all"
check = "aggregator: required / verdict"
run = '"$JIG" caller --workflow ci-controls/fixtures/caller.yml'
plant = "ci-controls/caller-write-all"
stderr_or_stdout_matches = "permissions: is .write-all."

[[control]]
id = "caller-no-merge-group"
check = "aggregator: required / verdict"
run = '"$JIG" caller --workflow ci-controls/fixtures/caller.yml'
plant = "ci-controls/caller-no-merge-group"
stderr_or_stdout_matches = 'lacks merge_group'

# The planted manifest is stored as Cargo.toml.planted so dependency bots do
# not read it; plant (v0.5.0, plant#38) writes it as Cargo.toml.
# rivet: verifies REQ-006
[[control]]
id = "supply-lock-stale"
check = "supply: baseline / supply"
run = 'bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-lock-stale"
stderr_or_stdout_matches = '--locked'
shallow_git = true

[[control]]
id = "rivet-broken-link"
check = "rivet: rivet validate"
run = 'rivet validate'
plant = "ci-controls/rivet-broken-link"
stderr_or_stdout_matches = 'SC-DOES-NOT-EXIST. which does not exist'

[[control]]
id = "lint-actionlint"
check = "lint: actionlint"
run = 'actionlint -no-color .github/workflows/*.yml'
plant = "ci-controls/lint-actionlint"
stderr_or_stdout_matches = 'zz-planted\.yml'

[[control]]
id = "required-canary-not-advisory"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-canary-not-advisory"
stderr_or_stdout_matches = 'job .clippy. has continue-on-error'

# A workflow that hosts no baseline (REQ-024): baseline-job "" is green only
# without a baseline call there, and the verdict still sees a failure.
[[control]]
id = "caller-split-hosts-baseline"
check = "aggregator: required / verdict"
run = '"$JIG" caller --workflow ci-controls/fixtures/caller-split.yml --required-job required-kani --baseline-job ""'
plant = "ci-controls/caller-split-hosts-baseline"
stderr_or_stdout_matches = 'calls baseline.yml but baseline-job is empty'

[[control]]
id = "required-split-sees-failure"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs-split.json --workflow ci-controls/fixtures/caller-split.yml --self-job required-kani --baseline-job "" --never-skip clippy'
plant = "ci-controls/required-split-sees-failure"
stderr_or_stdout_matches = 'job .clippy. result is failure'

# A verdict whose record cannot be written is never green (REQ-023): the
# plant turns the record path into a directory.
[[control]]
id = "required-record-unwritable"
check = "aggregator: required / verdict"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy --record ci-controls/record/jig-record.json'
plant = "ci-controls/required-record-unwritable"
stderr_or_stdout_matches = 'cannot write record'

# The planted lock and manifest are stored as *.planted, so jig's own supply
# job does not audit them and Dependabot does not offer to "fix" the planted
# advisory (jig#9); plant (v0.5.0, plant#38) writes them under their real
# names, and the run is the same npm text as baseline.yml's supply step. Needs npm on PATH: without it the unplanted run
# is red, so the control fails.
# rivet: verifies REQ-006
[[control]]
id = "supply-npm-advisory"
check = "supply: baseline / supply"
run = 'bash ci-controls/npm-lockfiles.sh'
plant = "ci-controls/supply-npm-advisory"
stderr_or_stdout_matches = 'GHSA-xvch-5gv4-984h'
shallow_git = true

# Nested workspaces (REQ-025), from plant's examples/locks pack (plant#40):
# ci-controls/fixtures/cargo is a clean nested workspace with its own lock,
# and each control breaks it. The runs are baseline.yml's cargo steps
# (tests/supply.rs keeps the scripts equal to them). The stand-ins read only
# the root lock and must report FAIL-OPEN.
# supply-cargo-nested-missing stages the deletion first (git add -A), so the
# lock is gone from the index too, as when it was never committed.
# rivet: verifies REQ-025
[[control]]
id = "supply-cargo-nested-missing"
check = "supply: baseline / supply"
run = 'git add -A && bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-cargo-nested-missing"
stderr_or_stdout_matches = 'fixtures/cargo/Cargo\.lock: no committed Cargo\.lock'
shallow_git = true

# rivet: verifies REQ-025
[[control]]
id = "supply-cargo-nested-stale"
check = "supply: baseline / supply"
run = 'bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-cargo-nested-stale"
stderr_or_stdout_matches = '(?s)metadata --locked in ci-controls/fixtures/cargo.*--locked'
shallow_git = true

# Needs cargo-audit on PATH (ci.yml installs the same version as baseline.yml).
# rivet: verifies REQ-025
[[control]]
id = "supply-cargo-nested-vulnerable"
check = "supply: baseline / supply"
run = 'AUDIT=cargo-audit bash ci-controls/cargo-audit.sh'
plant = "ci-controls/supply-cargo-nested-vulnerable"
stderr_or_stdout_matches = 'RUSTSEC-2020-0071'
shallow_git = true

# The lockfile census (REQ-025): each control plants one faulty listing in
# jig's own census (ci-controls/fixtures/lockfile-census.toml, empty and
# clean). The run is the workflow step's text with that census. The stand-ins
# ignore the census and must report FAIL-OPEN.
# rivet: verifies REQ-025
[[control]]
id = "supply-census-stale-locked"
check = "supply: baseline / supply"
run = 'CENSUS=ci-controls/fixtures/lockfile-census.toml bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-census-stale-locked"
stderr_or_stdout_matches = 'is stale: its workspace has a committed'
shallow_git = true

# rivet: verifies REQ-025
[[control]]
id = "supply-census-stale-untracked"
check = "supply: baseline / supply"
run = 'CENSUS=ci-controls/fixtures/lockfile-census.toml bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-census-stale-untracked"
stderr_or_stdout_matches = 'is stale: it is not a tracked file'
shallow_git = true

# rivet: verifies REQ-025
[[control]]
id = "supply-census-wildcard"
check = "supply: baseline / supply"
run = 'CENSUS=ci-controls/fixtures/lockfile-census.toml bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-census-wildcard"
stderr_or_stdout_matches = 'is a wildcard'
shallow_git = true

# rivet: verifies REQ-025
[[control]]
id = "supply-census-no-reason"
check = "supply: baseline / supply"
run = 'CENSUS=ci-controls/fixtures/lockfile-census.toml bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-census-no-reason"
stderr_or_stdout_matches = 'manifest, issue and reason are required'
shallow_git = true

# rivet: verifies REQ-025
[[control]]
id = "supply-census-bad-issue"
check = "supply: baseline / supply"
run = 'CENSUS=ci-controls/fixtures/lockfile-census.toml bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-census-bad-issue"
stderr_or_stdout_matches = 'is not #N or owner/repo#N'
shallow_git = true

# rivet: verifies REQ-025
[[control]]
id = "supply-census-duplicate"
check = "supply: baseline / supply"
run = 'git add -A && CENSUS=ci-controls/fixtures/lockfile-census.toml bash ci-controls/cargo-lockfiles.sh'
plant = "ci-controls/supply-census-duplicate"
stderr_or_stdout_matches = 'is listed 2 times'
shallow_git = true


# rivet: verifies REQ-026
# The planted name must be found, and never printed: a run whose output
# contains it exits 0, which plant reports as a failed control.
[[control]]
id = "names-planted-host"
check = "names: jig names"
run = 'git add -A && out=$("$JIG" names --patterns ci-controls/fixtures/names-patterns.txt --allow ci-controls/fixtures/names-allow.txt .); rc=$?; printf "%s\n" "$out"; case "$out" in *zz-planted-ci-[0]1*) echo "jig printed the planted name"; exit 0;; esac; exit $rc'
plant = "ci-controls/names-planted-host"
stderr_or_stdout_matches = 'docs/zz-planted.md:3: matches pattern #1'
shallow_git = true

# rivet: verifies REQ-026
[[control]]
id = "names-no-patterns"
check = "names: jig names"
run = '"$JIG" names --patterns ci-controls/fixtures/names-patterns.txt --allow ci-controls/fixtures/names-allow.txt .'
plant = "ci-controls/names-no-patterns"
stderr_or_stdout_matches = 'no patterns; compared nothing'
shallow_git = true
