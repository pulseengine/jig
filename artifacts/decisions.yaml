# Design decisions (draft, 2026-11-21), from the proposal
# "Fleet CI unification" as distilled in docs/design.md.
artifacts:
  - id: DD-001
    type: design-decision
    title: jig is a separate repository from plant
    status: draft
    fields:
      decision: The baseline lives in jig and consumes plant and sieve as signed release binaries.
      rationale: >
        plant is the checker; keeping the decider (sieve, the baseline) and its
        check apart means a defect in one cannot hide itself in the other.
        plant is pre-1.0 and ships often, while the baseline is glue that
        callers pin by SHA.
      alternatives: Host the reusable workflows inside plant.
    links:
      - type: satisfies
        target: REQ-004
      - type: satisfies
        target: REQ-010

  - id: DD-002
    type: design-decision
    title: Two reusable workflows, baseline.yml and required.yml
    status: draft
    fields:
      decision: The aggregator is its own reusable workflow that the caller invokes last.
      rationale: >
        The aggregator must `needs:` the caller's own jobs, which a job inside
        a single called workflow cannot do. Two calls stay within the
        reusable-workflow nesting limit.
    links:
      - type: satisfies
        target: REQ-001
      - type: satisfies
        target: REQ-002

  - id: DD-003
    type: design-decision
    title: One required context per repo, required / verdict
    status: draft
    fields:
      decision: Protection lists required / verdict (optionally baseline / guard) instead of every job.
      rationale: >
        Lists of up to 22 contexts drift from the workflow; a job missing from
        the list is never required. The completeness check moves that list
        into the verdict, where it is checked on every run.
    links:
      - type: satisfies
        target: REQ-002
      - type: satisfies
        target: REQ-014

  - id: DD-004
    type: design-decision
    title: Shadow mode by default; enforce skips only behind a merge queue
    status: draft
    fields:
      decision: enforce-skips defaults to false and is set true only in repos with a merge queue.
      rationale: >
        sieve selects everything on non-PR events, so every queue run is a full
        run and a false skip can delay a red but never merge one. Without a
        queue that safety net does not exist.
    links:
      - type: satisfies
        target: REQ-003
      - type: satisfies
        target: REQ-013

  - id: DD-005
    type: design-decision
    title: Checks are a Rust CLI that also builds as a WASI component
    status: draft
    fields:
      decision: verdict, completeness and pins are subcommands of one Rust binary, jig, with a built-in self-test.
      rationale: >
        The org forbids new Python; a Rust binary runs on hosted and
        self-hosted runners without an interpreter, and a wasm32-wasip2 build
        lets our own chain build, sign and run it later.
      alternatives: Shell and jq inside the workflow; rejected because a decision table cannot be self-tested there.
    links:
      - type: satisfies
        target: REQ-001
      - type: satisfies
        target: REQ-005
      - type: satisfies
        target: REQ-008

  - id: DD-006
    type: design-decision
    title: A job declares its class in its if, in sieve's exact form
    status: draft
    fields:
      decision: A gated job's if reads needs.baseline.outputs.<class>; verdict reads the class from there.
      rationale: >
        One declaration serves GitHub (the skip), sieve check-workflows (the
        map) and the verdict (the judgement), so the three cannot disagree. A
        skipped job without a readable class is red.
    links:
      - type: satisfies
        target: REQ-001
      - type: satisfies
        target: REQ-003

  - id: DD-007
    type: design-decision
    title: Callers pin jig by SHA and bump through their own PR
    status: draft
    fields:
      decision: Every caller references jig at a 40-hex SHA and moves it only through a bump PR and its queue, pilots first with a 48 h soak.
      rationale: >
        A jig defect then reaches one repo at a time and is undone by reverting
        that repo's pin, instead of breaking the fleet at once.
    links:
      - type: satisfies
        target: REQ-012
      - type: satisfies
        target: REQ-013

  - id: DD-008
    type: design-decision
    title: supply checks each Cargo.lock on its own
    status: draft
    fields:
      decision: >
        For every tracked file named exactly Cargo.lock, run cargo metadata
        --locked in its directory and the configured auditor on that lock; with
        bazel, require lockfile_mode=error.
      rationale: >
        Repos carry nested workspaces and fixtures; a gate that reads only the
        root lock passes a stale or vulnerable nested one (plant's
        lock-*-nested controls show this). An auditor that cannot run is a
        failure, not a skip.
    links:
      - type: satisfies
        target: REQ-006
      - type: satisfies
        target: REQ-007

  - id: DD-009
    type: design-decision
    title: guard is plant guard, run on the caller's and jig's workflows
    status: draft
    fields:
      decision: baseline / guard runs the pinned plant guard binary; jig runs it on its own workflows too.
      rationale: >
        plant guard already parses workflows as YAML and carries relay's 19
        decision tests plus 13 shapes the line parser missed; a second
        implementation would drift. Open seam: plant guard currently rejects
        any job that calls a reusable workflow from another repository, which
        every jig caller does (plant#33). A fix exists on a local plant branch,
        unreleased as of 2026-11-21: callers list jig in plant-guard.toml
        `trusted_workflows`, and a call passes only when pinned to a 40-hex SHA,
        without runs-on, under allowlisted triggers. The pilot needs a plant
        release carrying it.
    links:
      - type: satisfies
        target: REQ-009

  - id: DD-010
    type: design-decision
    title: The reusable workflows declare no secrets
    status: draft
    fields:
      decision: >
        baseline.yml and required.yml declare no secrets in workflow_call,
        set job permissions to contents: read (actions: read only on
        verdict), and callers never use secrets: inherit.
      rationale: >
        jig runs in every caller, including on fork pull requests via the
        hosted fallback; holding no secret leaves nothing to leak, and a
        read-only token cannot push.
    links:
      - type: satisfies
        target: REQ-011

  - id: DD-011
    type: design-decision
    title: Classification stays in the caller
    status: draft
    fields:
      decision: >
        Each caller keeps sieve's classify step as its own job; baseline.yml
        does not classify, and the verdict reads class selections from that
        job (owner decision 2026-11-21).
      rationale: >
        A reusable workflow's outputs are static, so classifying inside
        baseline.yml needed a fixed class vocabulary. gale, the first real
        adopter, failed it on all six classes (zephyr, zephyr_renode,
        rust_cov, proofs, gust_renode, cross_arch), most of them per-target
        lanes that lose selectivity if merged. A caller-side job keeps the
        adopter's names, and sieve check-workflows already verifies that form
        today, with no wait for uses: support.
      alternatives: >
        Grow the vocabulary (rejected: a jig change for every new kind of
        lane, and renaming in every adopter).
    links:
      - type: satisfies
        target: REQ-016

  - id: DD-012
    type: design-decision
    title: Delegate to caller aggregators instead of absorbing them
    status: draft
    fields:
      decision: >
        The verdict judges a caller aggregator's result and checks that it
        covers its delegated jobs; it does not judge those jobs.
      rationale: >
        relay's Kani and Verus gates accept a skip only with a recorded reason
        (deferred, out-of-scope) and enforce an anti-vacuity floor; a generic
        success/skip roll-up would pass a vacuous or unexplained skip (relay,
        2026-11-21).
    links:
      - type: satisfies
        target: REQ-015

  - id: DD-013
    type: design-decision
    title: Tools through the varve layer, plant by recorded digest
    status: draft
    fields:
      decision: >
        sieve and rivet come from the caller's varve pin (install, verify,
        VARVE_ROOT under RUNNER_TEMP); plant from a release whose sha256 was
        recorded once from its cosign-verified sums, until a layer carries the
        plant release jig needs.
      rationale: >
        The layer is the org's consumer channel and verifies every tool
        against its realm root (varve, sieve-d1). plant 0.2.0 in the current
        layer lacks trusted_workflows (plant#33) and shallow_git, both
        unreleased (plant-2a).
    links:
      - type: satisfies
        target: REQ-010
      - type: satisfies
        target: REQ-019

  - id: DD-014
    type: design-decision
    title: The verdict also checks the caller workflow's shape
    status: draft
    fields:
      decision: >
        required.yml runs `jig caller` on the caller workflow before the
        verdict: pull_request and merge_group triggers without filters, no
        pull_request_target, a required job with `if: always()` that needs
        every other job, and baseline and required pinned to the same SHA.
      rationale: >
        A required job outside the merge queue stalls every entry (relay's
        Verus history), a paths filter skips a required context unseen, and
        mismatched SHAs mix two jig versions in one verdict. Checking the
        shape on every run keeps it from drifting after adoption.
    links:
      - type: satisfies
        target: REQ-017
      - type: satisfies
        target: REQ-018

  - id: DD-015
    type: design-decision
    title: The canary marker is continue-on-error, checked by pins and verdict
    status: draft
    fields:
      decision: >
        A job-level continue-on-error true, on a job nothing but the verdict
        job needs, is the
        only way a stable toolchain passes pins, and pins names the job. The
        verdict refuses any continue-on-error job outside its advisory list.
      rationale: >
        continue-on-error already makes a job's result read success, so it
        is the job that can never gate. Requiring it ties the exemption to a
        GitHub-visible property instead of a comment, keeps what the canary
        builds from flowing into other jobs (the verdict job only reads
        results, and REQ-017 makes it need every job), and the verdict check stops the
        job from silently counting as a passed required check. Hiding the
        canary in an unscanned file was rejected as a blind spot.
    links:
      - type: satisfies
        target: REQ-021
      - type: satisfies
        target: REQ-017

  - id: DD-016
    type: design-decision
    title: supply installs node itself, and jig's tree carries an npm fixture
    status: draft
    fields:
      decision: >
        supply runs a SHA-pinned actions/setup-node with an exact node
        version when the tree has a package-lock.json, and stops with "npm
        unavailable" if npm is still missing. jig tracks a clean fixture lock
        (ci-controls/fixtures/npm), so its own baseline supply runs the npm
        path on the light pool. The supply-npm-advisory control plants a
        minimist 1.2.5 lock and runs the same text as the workflow step
        (tests/supply.rs keeps them equal).
      rationale: >
        The light pool has no node, so supply exited 127 on the first caller
        with a package-lock.json (warte#194). jig had no lockfile, so the npm
        branch never ran in its own CI. The planted lock and manifest are
        stored as package-lock.json.planted and package.json.planted, because
        supply would otherwise audit them in jig's own tree and Dependabot
        would offer to "fix" the planted advisory (jig#9); plant v0.5.0
        (plant#38) writes them under their real names in its copy. Skipping npm when it is absent was rejected: a lock
        that is never audited is a silent pass.
    links:
      - type: satisfies
        target: REQ-006
      - type: satisfies
        target: REQ-007

  - id: DD-017
    type: design-decision
    title: Workspaces come from the manifests; a census may exempt one
    status: draft
    fields:
      decision: >
        The cargo lockfiles step resolves every tracked Cargo.toml (outside
        target/) to its workspace root and requires a committed Cargo.lock for
        each, then keeps the existing freshness and audit loops over the
        tracked locks. jig tracks a clean nested workspace
        (ci-controls/fixtures/cargo) and plants a missing, a stale and a
        vulnerable lock in it; the controls run the workflow's own text
        (ci-controls/cargo-lockfiles.sh and cargo-audit.sh, kept equal by
        tests/supply.rs), and root-only stand-ins report FAIL-OPEN. The check is
        a jig subcommand (jig lockfiles) so the census is parsed as TOML, not
        shell text. A workspace may ship without a lock only when the caller's
        census lists it (gale's tools/xtask/lockfile-census.toml format: one
        [[lockfree]] per manifest, issue and reason required, no wildcards,
        stale listings fail); one control per refusal plants a faulty listing.
      rationale: >
        plant's lockfile pack (plant#40) run against jig v0.1.4's supply text
        on 2026-11-25 found lock-missing-nested FAIL-OPEN: jig walked only
        tracked Cargo.lock files, so a nested workspace whose lock was never
        committed passed. The owner chose this over copying plant's
        lockfiles.sh (which would drop the cargo-deny input and rename the
                steps callers see) and over deferring (2026-11-25). gale ships six
        workspaces lock-free on purpose and lists them in its census; the owner
        chose census-format exemptions in v0.1.6 (2026-11-25, confirmed in jig's
        dialog after an earlier "decide at adoption" answer).
      alternatives: >
        Copy plant's scripts/lockfiles.sh as the gate (rejected: loses the
        cargo-deny choice and the per-step structure); document the gap and
        defer (rejected by the owner); strict with no exemptions (rejected: it
        forces locks for workspaces nothing builds, which nobody keeps current).
    links:
      - type: satisfies
        target: REQ-025

  - id: DD-018
    type: design-decision
    title: Private names are matched by index-numbered patterns, and never printed
    status: draft
    fields:
      decision: >
        jig names takes a patterns file (one Rust regex per line) and an
        optional allow file (paths, a trailing / for a directory), lists the
        index with git ls-files --stage, reads each blob with git cat-file --batch
        (what a commit publishes, so filters and working-tree-encoding cannot
        change it), matches it as bytes (binary and non-UTF-8 files too, so a
        NUL byte cannot hide a name), matches paths per component and dotted
        piece, redacts a matching path as <tracked path N>, and prints file:line: matches pattern #n. The patterns'
        text and the matched text are never printed, including in errors. The
        controls plant a synthetic name (names-planted-host) and an empty
        patterns file (names-no-patterns); the first control exits 0 if the
        output contains the planted name, so an echo fails it. Stand-ins (a
        never-matching pattern, an empty list that skips the check) report
        FAIL-OPEN.
      rationale: >
        A fleet sweep found self-hosted runner hostnames in tracked files of
        public repositories (jig#17). CI logs of public repositories are
        public, so a check that printed the match would leak it again. Wiring
        into baseline.yml waits on the owner: GitHub prints a step's env values
        in the log before the step runs (measured in jig run 45605454802), so
        an exact-name list passed as an input would be printed whatever the
        step masks afterwards.
      alternatives: >
        Mask the list with ::add-mask:: in the step (rejected: the env header
        is printed first); print the match for convenience (rejected: leaks);
        glob allow entries (rejected: an allow list should name what it
        skips).
    links:
      - type: satisfies
        target: REQ-026

  - id: DD-019
    type: design-decision
    title: baseline runs jig names on tracked shape patterns, and an empty input is red
    status: draft
    fields:
      decision: >
        baseline.yml's pins job runs jig names with two inputs: names-patterns
        (a tracked file of regex shapes that name no real host, or none) and
        names-allow (a tracked allow file). Empty names-patterns is red, a path
        that is not tracked is red, and none is an explicit opt-out the step
        logs. The step's text is ci-controls/names.sh (kept equal by
        tests/supply.rs); controls plant an empty input, an untracked patterns
        file and a synthetic name, and stand-ins that skip on empty, read any
        path, or skip staging report FAIL-OPEN.
      rationale: >
        GitHub prints a step's env values in the log header before the step
        runs (jig run 45605454802), so exact names passed as an input would be
        printed whatever ::add-mask:: does afterwards; the owner chose shape
        patterns only and fail-closed (2026-11-25, decision
        20261125T144454-ef84c1, confirmed in jig's dialog). Exact names stay
        with the fleet sweep.
      alternatives: >
        An optional caller secret with the exact list (rejected by the owner:
        first secret in jig's interface); sha256 digests in an org variable
        (rejected: short hostnames can be brute-forced from public digests);
        off by default (rejected: a caller that never opts in is unguarded).
    links:
      - type: satisfies
        target: REQ-026
