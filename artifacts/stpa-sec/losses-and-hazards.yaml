# STPA-Sec seed for jig (draft, 2026-11-21). Shares the control structure
# with artifacts/stpa once that is drawn.
artifacts:
  - id: SL-1
    type: sec-loss
    title: Compromise of a self-hosted runner host
    status: draft
    description: >
      Untrusted code executes on a self-hosted runner and gains persistence,
      network position or access to other repositories' workspaces.
    fields:
      cia-impact: [integrity, confidentiality, availability]
      stakeholders: [org-infrastructure]

  - id: SL-2
    type: sec-loss
    title: Malicious code injected into fleet repositories or releases
    status: draft
    description: >
      Code an attacker controls (a moved action tag, a swapped tool binary, a
      dependency with a known advisory) runs in CI of every caller and can
      alter what is merged, built or released.
    fields:
      cia-impact: [integrity]
      stakeholders: [maintainers, release-consumers]

  - id: SL-3
    type: sec-loss
    title: Disclosure of repository tokens or secrets
    status: draft
    fields:
      cia-impact: [confidentiality]
      stakeholders: [maintainers, org-infrastructure]

  - id: SH-1
    type: sec-hazard
    title: Fork code reaches a self-hosted runner
    status: draft
    description: >
      A pull request from a fork runs on a self-hosted runner because a job's
      runs-on is not in the fail-closed form, a label is misspelled so the
      fallback never applies, or a self-hosted job sits in a
      pull_request_target workflow.
    fields:
      cia-impact: [integrity, confidentiality]
      severity: critical
    links:
      - type: leads-to-sec-loss
        target: SL-1
      - type: leads-to-sec-loss
        target: SL-3

  - id: SH-2
    type: sec-hazard
    title: Unpinned action in the baseline itself
    status: draft
    description: >
      A uses: in jig's own workflows references a tag or branch, so whoever
      can move that ref runs code in every caller's CI.
    fields:
      cia-impact: [integrity, confidentiality]
      severity: critical
    links:
      - type: leads-to-sec-loss
        target: SL-2
      - type: leads-to-sec-loss
        target: SL-3

  - id: SH-3
    type: sec-hazard
    title: Unverified tool binary executed by the baseline
    status: draft
    description: >
      plant, sieve or another tool is downloaded by name or "latest" without
      a version and sha256 or a verified varve layer, and a swapped binary
      runs in every caller.
    fields:
      cia-impact: [integrity]
      severity: critical
    links:
      - type: leads-to-sec-loss
        target: SL-2

  - id: SH-4
    type: sec-hazard
    title: Baseline holds secrets or broad token permissions
    status: draft
    description: >
      jig asks callers for secrets, inherits them, or runs with a token wider
      than contents: read (and actions: read for completeness).
    fields:
      cia-impact: [confidentiality, integrity]
      severity: high
    links:
      - type: leads-to-sec-loss
        target: SL-3
      - type: leads-to-sec-loss
        target: SL-2

  - id: SH-5
    type: sec-hazard
    title: Dependency with a known advisory merges unaudited
    status: draft
    description: >
      A Cargo.lock the audit did not visit, or an audit step that fails open,
      lets a dependency with a published advisory into a caller.
    fields:
      cia-impact: [integrity]
      severity: high
    links:
      - type: leads-to-sec-loss
        target: SL-2

  - id: SH-6
    type: sec-hazard
    title: A private infrastructure name is published in a tracked file
    status: draft
    description: >
      A self-hosted runner hostname or other private name lands in a tracked
      file of a public repository (a fleet sweep found several), giving an
      attacker the names to target.
    fields:
      cia-impact: [confidentiality]
      severity: medium
    links:
      - type: leads-to-sec-loss
        target: SL-1

  - id: SSC-1
    type: sec-constraint
    title: Fork pull requests never reach self-hosted runners
    status: draft
    description: >
      Every self-hosted job uses the fail-closed runs-on expression; no
      self-hosted job runs in a pull_request_target workflow; plant guard
      checks the caller's and jig's own workflows.
    links:
      - type: prevents-sec-hazard
        target: SH-1

  - id: SSC-2
    type: sec-constraint
    title: Every action reference in jig is a commit SHA
    status: draft
    description: >
      Every uses: in jig (local ./ excepted) is a 40-hex SHA, and jig passes
      its own pin check.
    links:
      - type: prevents-sec-hazard
        target: SH-2

  - id: SSC-3
    type: sec-constraint
    title: Tool binaries are pinned by version and digest
    status: draft
    description: >
      Every binary the baseline runs is fetched by exact version and verified
      against a sha256 or a signed varve layer before it executes.
    links:
      - type: prevents-sec-hazard
        target: SH-3

  - id: SSC-4
    type: sec-constraint
    title: The baseline runs without secrets and with least privilege
    status: draft
    description: >
      jig declares no secrets input, uses no org secrets, and its jobs run with
      contents: read, plus actions: read only where the completeness step
      needs it.
    links:
      - type: prevents-sec-hazard
        target: SH-4

  - id: SSC-5
    type: sec-constraint
    title: Every lockfile is audited and the audit fails closed
    status: draft
    description: >
      Every tracked Cargo.lock is audited; an audit that cannot run counts as
      a failure.
    links:
      - type: prevents-sec-hazard
        target: SH-5

  - id: SSC-6
    type: sec-constraint
    title: No tracked file carries a private name, and no check prints one
    status: draft
    description: >
      A change that adds a match of the caller's private-name patterns to a
      tracked file is refused, and the check names the file, line and pattern
      index, never the matched text.
    links:
      - type: prevents-sec-hazard
        target: SH-6

  - id: SH-7
    type: sec-hazard
    title: A job meant to run confined runs unconfined, unnoticed
    status: draft
    description: >
      A self-hosted runner without zwinger (or with it not enforcing) takes a
      job, and nothing in the run says so; a label the job itself can set
      reads as confined.
    fields:
      cia-impact: [integrity, confidentiality]
      severity: high
    links:
      - type: leads-to-sec-loss
        target: SL-1

  - id: SSC-7
    type: sec-constraint
    title: Confinement is shown by kernel refusals the job cannot forge
    status: draft
    description: >
      On a runner labelled confined, the baseline proves confinement by a
      write and a read the kernel refuses although Unix permissions allow
      them, and treats environment labels as labels only.
    links:
      - type: prevents-sec-hazard
        target: SH-7

  # ---- security UCAs (controllers in artifacts/stpa/control-structure.yaml) ----
  - id: SUCA-1
    type: sec-uca
    title: guard passes a workflow that sends a fork PR to self-hosted
    status: draft
    fields:
      uca-type: providing
      context: a pull_request from a fork; a runs-on shape the guard does not recognise
      adversarial-causation: >
        A fork author opens a pull request whose code runs in a job whose
        runs-on selects self-hosted labels, for example through a misspelled
        label that defeats the fallback or a pull_request_target trigger.
      attacker-type: external-network
    links:
      - type: issued-by
        target: CTRL-GUARD
      - type: leads-to-sec-hazard
        target: SH-1

  - id: SUCA-2
    type: sec-uca
    title: pins passes a mutable action reference in jig
    status: draft
    fields:
      uca-type: providing
      context: a uses with a tag or branch in jig's own workflows
      adversarial-causation: >
        An attacker who controls an upstream action repository moves its tag to
        malicious code, which then runs in every caller's CI through jig.
      attacker-type: supply-chain
    links:
      - type: issued-by
        target: CTRL-PINS
      - type: leads-to-sec-hazard
        target: SH-2

  - id: SUCA-3
    type: sec-uca
    title: supply passes a lockfile with a known advisory
    status: draft
    fields:
      uca-type: providing
      context: a nested Cargo.lock the scan skipped, or an auditor that failed to run
      adversarial-causation: >
        A malicious or compromised crate version with a published advisory is
        introduced through a dependency bump the audit did not see.
      attacker-type: supply-chain
    links:
      - type: issued-by
        target: CTRL-SUPPLY
      - type: leads-to-sec-hazard
        target: SH-5
