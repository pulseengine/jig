[[control]]
id = "stand-in-supply-npm-advisory"
check = "supply: a supply job that skips package-lock.json"
run = 'echo "0 package-lock.json file(s) checked"'
plant = "ci-controls/supply-npm-advisory"
stderr_or_stdout_matches = '.'

# An always-green caller check: it prints the caller docs, never the workflow.
[[control]]
id = "stand-in-caller-no-permissions"
check = "caller: always-green stand-in"
run = '"$JIG" docs caller'
plant = "ci-controls/caller-no-permissions"
stderr_or_stdout_matches = '.'

[[control]]
id = "stand-in-caller-write-all"
check = "caller: always-green stand-in"
run = '"$JIG" docs caller'
plant = "ci-controls/caller-write-all"
stderr_or_stdout_matches = '.'

# A verdict that writes no record cannot notice an unwritable record path.
[[control]]
id = "stand-in-required-record-unwritable"
check = "aggregator: verdict without --record"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-record-unwritable"
stderr_or_stdout_matches = '.'

# The split-workflow plants (REQ-024) against gates that cannot fail.
[[control]]
id = "stand-in-caller-split-hosts-baseline"
