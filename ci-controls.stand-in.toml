# A verdict that writes no record cannot notice an unwritable record path.
[[control]]
id = "stand-in-required-record-unwritable"
check = "aggregator: verdict without --record"
run = '"$JIG" verdict --needs ci-controls/fixtures/needs.json --workflow ci-controls/fixtures/caller.yml --never-skip clippy'
plant = "ci-controls/required-record-unwritable"
stderr_or_stdout_matches = '.'

