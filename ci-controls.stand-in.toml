[[control]]
id = "stand-in-names-planted-host"
check = "names: a pattern that never matches"
run = 'git add -A && "$JIG" names --patterns ci-controls/fixtures/names-never.txt --allow ci-controls/fixtures/names-allow.txt .'
plant = "ci-controls/names-planted-host"
stderr_or_stdout_matches = '.'
shallow_git = true

[[control]]
id = "stand-in-names-no-patterns"
check = "names: an empty list skips the check"
run = 'if grep -qv "^#" ci-controls/fixtures/names-patterns.txt; then "$JIG" names --patterns ci-controls/fixtures/names-patterns.txt --allow ci-controls/fixtures/names-allow.txt .; fi'
plant = "ci-controls/names-no-patterns"
stderr_or_stdout_matches = '.'
shallow_git = true

[[control]]
id = "stand-in-names-input-empty"
check = "names: an empty input skips the check"
run = 'p=$(cat ci-controls/fixtures/names-input); [ -n "$p" ] || exit 0; jig names . --patterns "$p" --allow ci-controls/fixtures/names-allow.txt'
plant = "ci-controls/names-input-empty"
stderr_or_stdout_matches = '.'
shallow_git = true

[[control]]
id = "stand-in-names-input-untracked"
check = "names: patterns read from any path"
run = 'jig names . --patterns "$(cat ci-controls/fixtures/names-input)" --allow ci-controls/fixtures/names-allow.txt'
plant = "ci-controls/names-input-untracked"
stderr_or_stdout_matches = '.'
shallow_git = true

[[control]]
id = "stand-in-names-step-planted-host"
check = "names: the step without git add sees nothing new"
run = 'NAMES_PATTERNS=$(cat ci-controls/fixtures/names-input) NAMES_ALLOW=ci-controls/fixtures/names-allow.txt bash ci-controls/names.sh'
plant = "ci-controls/names-step-planted-host"
stderr_or_stdout_matches = '.'
shallow_git = true

[[control]]
id = "stand-in-names-input-none-reported"
check = "names: none passes silently"
run = 's=$(mktemp); o=$(mktemp); p=$(cat ci-controls/fixtures/names-input); if [ "$p" = none ]; then echo "names-patterns: none" > "$o"; else jig names . --patterns "$p" --allow ci-controls/fixtures/names-allow.txt > "$o"; fi; rc=$?; cat "$o"; [ "$rc" -eq 0 ] || exit 2; if grep -q "^::warning title=names: off::" "$o" && grep -q "^names: off" "$s"; then echo "reported: names off"; exit 1; fi'
plant = "ci-controls/names-input-none"
stderr_or_stdout_matches = '.'
shallow_git = true
